[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-braille-toolkit"
version = "0.1.0a1"
description = "Chinese braille chart OCR, table restore, and semantic translation (FastAPI + Qwen3-8B/LoRA)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chinese Braille Toolkit contributors" }]
keywords = ["braille", "chinese", "ocr", "translation", "mt5", "qwen"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
mt5 = ["transformers", "sentencepiece", "torch"]
qwen = ["transformers>=4.40", "accelerate", "torch", "peft>=0.10", "bitsandbytes>=0.43", "sentencepiece"]
ocr = ["opencv-python-headless>=4.8", "numpy", "Pillow"]
dev = ["pytest>=7.0"]
synth = ["pypinyin>=0.53.0"]
demo = ["gradio>=4.0"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]
desktop = ["PySide6"]
train = [
  "torch",
  "transformers>=4.40",
  "accelerate",
  "peft>=0.10",
  "bitsandbytes>=0.43",
  "datasets",
  "trl>=0.9",
  "pyyaml",
  "sentencepiece",
]

[project.urls]
Homepage = "https://github.com/AAA2025-KING/-"
Documentation = "https://github.com/AAA2025-KING/-#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chinese_braille_toolkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
